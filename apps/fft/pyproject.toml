[project]
name = "chiptune"
version = "0.1.0"
description = "Pac-Man style arcade sound synthesis and FFT analysis"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chiptune"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
